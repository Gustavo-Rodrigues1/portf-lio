<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#251c14" />
      <stop offset="70%" stopColor="#140f0c" />
      <stop offset="100%" stopColor="#0b0806" />
    </radialGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f1d289" />
      <stop offset="50%" stopColor="#c69c4d" />
      <stop offset="100%" stopColor="#7a5a22" />
    </linearGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#e2d2b4" />
      <stop offset="100%" stopColor="#a38965" />
    </linearGradient>
  </defs>

  <!-- Fundo do medalhão -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" stroke="url(#brassGrad)" stroke-width="4" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#5d4528" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Silhueta da cabeça e ombros -->
  <g fill="url(#silhouetteGrad)" opacity="0.85">
    <!-- Cabeça -->
    <circle cx="100" cy="74" r="32" />
    <!-- Ombros / Tronco -->
    <path d="M 46 154 C 46 116, 70 110, 100 110 C 130 110, 154 116, 154 154 C 154 162, 142 166, 100 166 C 58 166, 46 162, 46 154 Z" />
  </g>

  <!-- Pequeno monóculo / engrenagem técnica no olho -->
  <circle cx="108" cy="72" r="8" fill="none" stroke="#ffbe5b" stroke-width="1.5" />
  <line x1="116" y1="72" x2="128" y2="76" stroke="#c69c4d" stroke-width="1.2" />

  <!-- Gravata / Colarinho Vitoriano -->
  <path d="M 92 110 L 100 124 L 108 110 Z" fill="#2a1f16" stroke="url(#brassGrad)" stroke-width="1" />

  <!-- Rebites da borda externa -->
  <circle cx="100" cy="12" r="2.5" fill="#f1d289" />
  <circle cx="100" cy="188" r="2.5" fill="#f1d289" />
  <circle cx="12" cy="100" r="2.5" fill="#f1d289" />
  <circle cx="188" cy="100" r="2.5" fill="#f1d289" />
  <circle cx="38" cy="38" r="2.5" fill="#f1d289" />
  <circle cx="162" cy="38" r="2.5" fill="#f1d289" />
  <circle cx="38" cy="162" r="2.5" fill="#f1d289" />
  <circle cx="162" cy="162" r="2.5" fill="#f1d289" />
</svg>
